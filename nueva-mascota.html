<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <title>Pet Care - Registro</title>
    <link rel="stylesheet" href="style.css">

<body class="pantalla-centrada">

    <div class="contenedor-login">
        <div class="cabecera">
            <h1>Pet Care 🐾</h1>
            <p>Crea tu cuenta para empezar</p>
        </div>
        
        <form id="form-registro">
            
            <div class="grupo-input">
                <label>Nombre</label>
                <input type="text" id="nombreInput" placeholder="Ej: Nombre Animal" required>
            </div>

            <div class="grupo-input">
                <label>Especie</label>
                <input type="text" id="especieInput" placeholder="Ej: Gato" required>
            </div>

            <div class="grupo-input">
                <label>Raza</label>
                <input type="text" id="razaInput" placeholder="Ej: Mastín" required>
            </div>

            <div class="grupo-input">
                <label>Especie</label>
                <input type="text" id="especieInput" placeholder="Ej: Gato" required>
            </div>
               <div class="grupo-input">
                <label>Genero</label>
                <input type="text" id="generoInput" placeholder="Macho/hembra" required>
            </div>

            <div class="grupo-input">
                <label>NIF</label>
                <input type="text" id="nifinput" maxlength="9" placeholder="Identificación" required>
            </div>
            
            <div class="grupo-input">
                <label>Fecha Nacimiento</label>
                <input type="text" id="fechaNacimiento" placeholder="00-00-00">
            </div>

            <div class="grupo-input">
                <label>Peso</label>
                <input type="text" id="pesoInput" placeholder="Kg" required>
            </div>

            <div class="grupo-input">
                <label>Contraseña</label>
                <input type="text" id="passwordInput" placeholder="••••••••" required>
            </div>
            
            <div class="grupo-input">
                <label>Datos relevantes</label>
                <input type="text" id="datosdInput" placeholder="      " required>

            <button type="submit" class="btn-principal">Registrar nueva mascota</button>
        </form>
        </p>
