<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HuellApp - Nueva Mascota</title>
    <link rel="icon" type="image/png" sizes="32x32" href="./img/favicon.png">
    <link rel="stylesheet" href="style.css">
</head>
  
<body class="pantalla-centrada">
    <div class="contenedor-login">
        <div class="cabecera">
            <img src="./img/logo_web.png" alt="HuellApp" class="logo-nueva-mascota">
            <p>Registra los datos de tu pelud@</p>
        </div>
        
        <form id="form-nueva-mascota">
          
            <div class="grupo-input">
                <label>Nombre</label>
                <input type="text" id="nombreInput" placeholder="Ej: Max" required>
            </div>

            <div class="grupo-input">
                <label>Especie</label>
                <input type="text" id="especieInput" placeholder="Ej: Gato" required>
            </div>

            <div class="grupo-input">
                <label>Raza</label>
                <input type="text" id="razaInput" placeholder="Ej: Mastín" required>
            </div>
            <div class="grupo-input">
                <label>Genero</label>
                <input type="text" id="generoInput" placeholder="Macho/hembra" required>
            </div>

            <div class="grupo-input">
                <label>NIF/Chip</label>
                <input type="text" id="nifInput" maxlength="15" placeholder="Identificación" required>

            </div>
            
            <div class="grupo-input">
                <label>Fecha Nacimiento</label>
                <input type="date" id="fechaNacimiento" placeholder="00-00-00">
            </div>

            <div class="grupo-input">
                <label>Peso</label>
                <input type="text" id="pesoInput" placeholder="12 Kg" required>
            </div>
           
            <div class="grupo-input">
                <label>Datos relevantes (Alergias, etc.)</label>
                <input type="text" id="datosdInput" placeholder="Ninguno">
            </div>


            <button type="submit" class="btn-principal">Registrar nueva mascota</button>
        </form>

    <p id="mensaje" style="text-align: center; margin-top: 15px; font-weight: bold;"></p>
    <p id="mensaje" style="text-align: center; margin-top: 15px; font-weight: bold;"></p>

        <div style="text-align: center; margin-top: 20px;">
            <a href="dashboard.html" style="color: #0d9488; text-decoration: none; font-weight: bold;">
                ← Volver a mis mascotas
            </a>
        </div>
    </div>
    </div>
    <script>
        const form = document.getElementById('form-nueva-mascota');
        const mensaje = document.getElementById('mensaje');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const usuarioGuardado = JSON.parse(localStorage.getItem('usuario'));

            if (!usuarioGuardado) {
                mensaje.style.color = 'red';
                mensaje.textContent = 'Debes iniciar sesión antes de registrar una mascota.';
                return;
            }

            const datos = {
                nombre: document.getElementById('nombreInput').value,
                especie: document.getElementById('especieInput').value,
                raza: document.getElementById('razaInput').value,
                genero: document.getElementById('generoInput').value,
                nif_chip: document.getElementById('nifInput').value,
                fecha_nacimiento: document.getElementById('fechaNacimiento').value,
                peso: document.getElementById('pesoInput').value,
                datos_relevantes: document.getElementById('datosdInput').value || 'Ninguno',
                user_id: usuarioGuardado.id
            };

            try {
                const respuesta = await fetch('https://huellapp-api.onrender.com/api/mascotas', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(datos)
                });

                const resultado = await respuesta.json();

                if (respuesta.ok) {
                    mensaje.style.color = '#0d9488';
                    mensaje.textContent = '¡Mascota registrada con éxito!';
                    form.reset();
                    setTimeout(() => { 
                        window.location.href = 'dashboard.html';
                    }, 1500);
                } else {
                    mensaje.style.color = 'red';
                    mensaje.textContent = 'Error: ' + resultado.error;
                }
            } catch (error) {
                console.error('Error de conexión:', error);
                mensaje.style.color = 'red';
                mensaje.textContent = 'No se pudo conectar con el servidor.';
            }
        });
    </script>

  
</body>
</html>
