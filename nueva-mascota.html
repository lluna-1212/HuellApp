<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Care - Registro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="pantalla-centrada">

    <div class="contenedor-login">
        <div class="cabecera">
            <h1>Pet Care 🐾</h1>
            <p>Registra los datos de tu peludo</p>
        </div>
        
        <form id="form-Mascota">
            
            <div class="grupo-input">
                <label>Nombre</label>
                <input type="text" id="nombreInput" placeholder="Ej: Nombre Animal" required>
            </div>

            <div class="grupo-input">
                <label>Especie</label>
                <input type="text" id="especieInput" placeholder="Ej: Gato" required>
            </div>

            <div class="grupo-input">
                <label>Raza</label>
                <input type="text" id="razaInput" placeholder="Ej: Mastín" required>
            </div>

            <div class="grupo-input">
                <label>Género</label>
                <input type="text" id="generoInput" placeholder="Macho/hembra" required>
            </div>

            <div class="grupo-input">
                <label>NIF/Chip</label>
                <input type="text" id="nifinput" maxlength="15" placeholder="Identificación" required>
            </div>
            
            <div class="grupo-input">
                <label>Fecha Nacimiento</label>
                <input type="text" id="fechaNacimiento" placeholder="00-00-00">
            </div>

            <div class="grupo-input">
                <label>Peso</label>
                <input type="text" id="pesoInput" placeholder="Kg" required>
            </div>
            
            <div class="grupo-input">
                <label>Datos relevantes (Alergias, etc.)</label>
                <input type="text" id="datosdInput" placeholder="Ninguno" required>
            </div>


            <button type="submit" class="btn-principal">Registrar nueva mascota</button>
        </form>
    <p id="mensaje" style="text-align: center; margin-top: 15px; font-weight: bold;"></p>
    </div>
    
</body>
</html>
